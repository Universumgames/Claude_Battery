name: ClaudeUsageMenuBar
options:
  bundleIdPrefix: de.universegame
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ClaudeUsageMenuBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeUsageMenuBar
      - path: Sources/Shared
    dependencies:
      - target: ClaudeUsageWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: "Claude Usage"
        PRODUCT_BUNDLE_IDENTIFIER: de.universegame.ClaudeUsageMenuBar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 98ZXK38P8L
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/ClaudeUsageMenuBar/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        CFBundleIconName: AppIcon
    entitlements:
      path: Sources/ClaudeUsageMenuBar/ClaudeUsageMenuBar.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - group.de.universegame.ClaudeUsageMenuBar

  ClaudeUsageWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ClaudeUsageWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: "Claude Usage Widget"
        PRODUCT_BUNDLE_IDENTIFIER: de.universegame.ClaudeUsageMenuBar.Widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 98ZXK38P8L
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
    info:
      path: Sources/ClaudeUsageWidget/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    entitlements:
      path: Sources/ClaudeUsageWidget/ClaudeUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.de.universegame.ClaudeUsageMenuBar

schemes:
  Claude Usage:
    build:
      targets:
        ClaudeUsageMenuBar: all
    run:
      config: Debug
    archive:
      config: Release
