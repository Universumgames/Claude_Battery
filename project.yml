name: ClaudeBattery
options:
  bundleIdPrefix: de.universegame
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ClaudeBattery:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeBattery
      - path: Sources/Shared
    dependencies:
      - target: ClaudeBatteryWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: "ClaudeBattery"
        PRODUCT_BUNDLE_IDENTIFIER: de.universegame.ClaudeBattery
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 98ZXK38P8L
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/ClaudeBattery/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "13.0"
        CFBundleIconName: AppIcon
    entitlements:
      path: Sources/ClaudeBattery/ClaudeBattery.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - group.de.universegame.ClaudeBattery

  ClaudeBatteryWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ClaudeBatteryWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: "ClaudeBattery Widget"
        PRODUCT_BUNDLE_IDENTIFIER: de.universegame.ClaudeBattery.Widget
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 98ZXK38P8L
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
    info:
      path: Sources/ClaudeBatteryWidget/Info.plist
      properties:
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
    entitlements:
      path: Sources/ClaudeBatteryWidget/ClaudeBatteryWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.de.universegame.ClaudeBattery

schemes:
  ClaudeBattery:
    build:
      targets:
        ClaudeBattery: all
    run:
      config: Debug
    archive:
      config: Release
